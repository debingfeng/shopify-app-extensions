api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Checkout learning demos"
handle = "checkout-ui-learning"
description = "Twelve Checkout UI Extension learning scenarios using Preact and Polaris Web Components"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/banner.tsx"

[[extensions.targeting]]
target = "purchase.checkout.cart-line-list.render-after"
module = "./src/upsell.tsx"

[[extensions.targeting]]
target = "purchase.checkout.footer.render-after"
module = "./src/discount.tsx"

[[extensions.targeting]]
target = "purchase.checkout.contact.render-after"
module = "./src/gift-message.tsx"

[[extensions.targeting]]
target = "purchase.checkout.delivery-address.render-after"
module = "./src/shipping.tsx"

[extensions.settings]
[[extensions.settings.fields]]
key = "upsell_variant_id"
type = "single_line_text_field"
name = "Upsell variant GID"
description = "ProductVariant GID used by Demo 02"

[extensions.capabilities]
network_access = true

[[extensions.targeting]]
target = "purchase.checkout.payment-method-list.render-after"
module = "./src/backend.tsx"

[[extensions.targeting]]
target = "purchase.checkout.header.render-after"
module = "./src/settings.tsx"

[[extensions.settings.fields]]
key = "settings_title"
type = "single_line_text_field"
name = "Merchant title"
description = "Heading shown by Demo 07"

[[extensions.settings.fields]]
key = "settings_message"
type = "multi_line_text_field"
name = "Merchant message"
description = "Message shown by Demo 07"
